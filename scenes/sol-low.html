<script>
'use strict';
function startScene(){
const canvas=document.querySelector('canvas');
const backup=document.createElement('canvas');
backup.style.cssText='position:absolute;inset:0;pointer-events:none';
backup.hidden=true;
backup.setAttribute('aria-hidden','true');
canvas.after(backup);
const ctx=backup.getContext('2d');
let useGPU=true;

const hint=document.querySelector('#hint');
const opening=document.querySelector('#opening');
window.addEventListener('error',event=>{
 hint.textContent='Scene error: '+event.message;
});
canvas.addEventListener('webglcontextlost',event=>{
 event.preventDefault();
 useGPU=false;
});
const gl=canvas.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true,failIfMajorPerformanceCaveat:true})
 ||canvas.getContext('experimental-webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true,failIfMajorPerformanceCaveat:true});
useGPU=!!gl;
const PI=Math.PI, TAU=2*PI;
const add=(a,b)=>a.map((x,i)=>x+b[i]), sub=(a,b)=>a.map((x,i)=>x-b[i]), mul=(a,s)=>a.map(x=>x*s);
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0), cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const unit=a=>mul(a,1/(Math.hypot(...a)||1)), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), mix=(a,b,t)=>a+(b-a)*t;
let seed=92734;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function program(v,f){
 if(!useGPU)return null;
 try {
 const p=gl.createProgram();
 for(const [type,src] of [[gl.VERTEX_SHADER,v],[gl.FRAGMENT_SHADER,f]]){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
  gl.attachShader(p,s);
 }
 gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;
 } catch(error){console.warn('Stillwater WebGL',error);useGPU=false;return null;}
}
const noiseGL=`
float hash(vec3 p){p=fract(p*.3183099+vec3(.11,.27,.43))*17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fb(vec3 p){return noise(p)*.56+noise(p*2.17+4.)*.28+noise(p*4.63-3.)*.12+noise(p*9.13)*.04;}
`;
const atmosphere=`
uniform vec3 sun, sunlight, horizon, zenith;
uniform float mode, time;
vec3 air(vec3 d){
 float y=max(d.y,0.);
 float s=max(dot(d,sun),0.);
 vec3 col=mix(horizon,zenith,pow(clamp(y*2.,0.,1.),.55));
 col+=sunlight*(.19*pow(s,10.)+.28*pow(s,110.)+1.5*smoothstep(.99976,.99986,s));
 vec3 p=vec3(d.x,0.,d.z)*(.86/(y+.17))+vec3(time*.0007,0.,.8);
 float cloud=fb(p*2.5+vec3(0,3.3,0))+ .10*fb(p*13.);
 float veil=smoothstep(.57,.76,cloud)*smoothstep(.008,.08,y)*(.83-.28*y);
 vec3 cloudColor=mix(zenith*.72+horizon*.16,horizon*.88+sunlight*.29,pow(s,.55));
 col=mix(col,cloudColor,veil);
 if(mode>1.5){float star=hash(floor(d*920.));col+=step(.9991,star)*smoothstep(.05,.6,y)*.44;}
 return col;
}
vec3 encode(vec3 c){return pow(clamp(c,0.,1.),vec3(.4545));}
`;
const sky=program(`attribute vec2 a;varying vec2 uv;void main(){uv=a;gl_Position=vec4(a,.999999,1.);}`,`
precision highp float;varying vec2 uv;uniform vec3 forward,right,up;uniform vec2 lens;
${noiseGL}${atmosphere}
void main(){vec3 d=normalize(forward+right*uv.x*lens.x+up*uv.y*lens.y);gl_FragColor=vec4(encode(air(d)),1.);}
`);
const surfaceVertex=`
attribute vec3 a,n,c;attribute float m;uniform mat4 vp,model;
varying vec3 P,N,C,L;varying float M;
void main(){vec4 p=model*vec4(a,1.);P=p.xyz;N=mat3(model)*n;C=c;L=a;M=m;gl_Position=vp*p;}
`;
const surfaceFragment=`
precision highp float;
varying vec3 P,N,C,L;varying float M;uniform vec3 eye;
uniform vec3 reefs[4];
${noiseGL}${atmosphere}
vec2 swell(vec2 p){vec2 gradient=vec2(0.);
